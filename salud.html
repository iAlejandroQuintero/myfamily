<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Salud Familiar</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0056b3, #00a8cc); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            color: #333; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .badge { background: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.9em; display: inline-block; margin-bottom: 8px; }
        .back-btn { display: inline-block; background: rgba(255,255,255,0.2); color: white; padding: 8px 15px; text-decoration: none; border-radius: 6px; margin-bottom: 20px; }
        .back-btn:hover { background: rgba(255,255,255,0.4); }
        .links-section { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 12px; margin-top: 40px; }
        .links-grid { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .link-btn { background: white; color: #0056b3; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .link-btn:hover { background: #f0f0f0; }
        .tip-link { color: #0277bd; font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Volver al Menú Principal</a>
        <h1>🏥 Panel de Salud Familiar</h1>
        <p style="text-align: center;">Control de sistemas corporales, estado clínico, próximas citas y recomendaciones de salud por edad.</p>

        <div class="grid" id="salud-container"></div>

        <div class="links-section">
            <h2>🔍 Sitios Médicos para Investigar Tratamientos</h2>
            <div class="links-grid" id="research-links"></div>
        </div>
    </div>

    <script src="salud_data.js"></script>
    <script>
        const container = document.getElementById('salud-container');
        saludData.forEach(p => {
            container.innerHTML += `
                <div class="card">
                    <div>
                        <img src="${p.imagenSistema}" alt="Sistema corporal">
                        <h3>${p.nombre} (${p.edad} años)</h3>
                        <div class="badge">Sistema: ${p.sistemaAfectado}</div>
                        <p><strong>Estado:</strong> ${p.estado}</p>
                        <p><strong>Próxima Cita:</strong> ${p.proximaCita}</p>
                    </div>
                    <div>
                        <a href="${p.linkTips}" target="_blank" class="tip-link">💡 Ver Tips de Salud (Edad ${p.edad})</a>
                    </div>
                </div>
            `;
        });

        const researchContainer = document.getElementById('research-links');
        paginasInvestigacionSalud.forEach(l => {
            researchContainer.innerHTML += `<a href="${l.url}" target="_blank" class="link-btn">🔗 ${l.nombre}</a>`;
        });
    </script>
</body>
</html>
